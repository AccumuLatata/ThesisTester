# Research Study Runner example — pdPOC × MA partners × modes × entries × OTF
#
# Stage-first default (ACTIVE): trigger=touch + trigger_timeframe=base → 40 cells
#   Formula: 1 core × 4 partners × 2 modes × 1 trigger × 1 tf × 5 OTF = 40
#
# Phase 2 (full cartesian = 800 cells): remove or widen `stage` on THIS example
# (or restore the original full factor domains). Do NOT drop `stage` from a
# `study promote` survivor draft — promote narrows factors to survivor values,
# so removing its explicit_cells stage expands only the narrowed cartesian.
#   Formula: 1 × 4 × 2 × 5 × 4 × 5 = 800
#
# Usage:
#   python -m thesistester study expand examples/studies/pdPOC_ma_confluence_battery.yaml \
#     --output-dir out/pdPOC_stage40
#   python -m thesistester study run examples/studies/pdPOC_ma_confluence_battery.yaml \
#     --output-dir out/pdPOC_stage40 --confirm
#   python -m thesistester study report out/pdPOC_stage40
#   python -m thesistester study promote out/pdPOC_stage40 \
#     --output drafts/pdPOC_survivors_draft.yaml --top-n 10
#
# Replace dataset.path with the same 15-second Quantower History Exporter
# CSV used on Data. A vendor-native 1m file is a different dataset.
# Replace dataset.tick_paths with Quantower Tick–Tick–Last export(s)
# (same session cut as the 15s file). Without ticks this named-VA study
# refuses: VA requires ticks.
# Omitting ingestion_mode on a 15s file is not this path (that loads 15s
# bars as the decision timeframe).
# Promote absolutizes relative dataset.path when possible (drafts/ is safe).
# Prefer non-zero commission_per_side / slippage_ticks before trusting ranks.
# Descriptive ranking ≠ validated edge (see docs/ASSUMPTIONS_AND_LIMITATIONS.md).

schema_version: 1
study:
  name: pdPOC_ma_confluence_battery
  description: >
    Stage-first pdPOC × MA confluence battery (40 cells). Full 800-cell
    cartesian is documented as phase-2 in comments above.
  output_dir: results/studies/pdPOC_ma_confluence_battery
  workers: 1
  confirm_above_runs: 200

  dataset:
    path: data/es_15s.csv
    # Named-VA cores require Quantower Tick–Tick–Last files (TV3). Launch
    # refuses if the files are missing, same posture as dataset.path.
    tick_paths:
      - data/es_ticks.csv
    instrument: ES
    source_timezone: America/New_York
    format_profile: quantower_history_exporter
    ingestion_mode: 15s_primary_derive_1m

  levels:
    sma_lengths: [50, 200]
    ema_lengths: [21]
    sma_timeframes: [1min, 5min, 30min]
    ema_timeframes: [1min, 5min, 30min]

  constants:
    direction: both
    tolerance_ticks: 0
    min_confluences: 2
    max_confluences: 2
    min_valid_confluences: 1
    naked_only: false
    naked_requirement: any
    trigger_params: {}
    entry_window: null
    backtest:
      stop_loss_ticks: 8
      take_profit_ticks: 16
      exposure_policy: single_position
      commission_per_side: 0.0
      slippage_ticks: 0.0
      flat_by_session_close: false
      intrabar_model: subtimeframe_conservative
    grid: {enabled: false}
    validation: {enabled: false}
    walk_forward: {enabled: false}

  factors:
    core_level: [pdPOC]
    partner_levels:
      - [SMA_50_1min]
      - [SMA_50_5min]
      - [SMA_200_30min]
      - [EMA_21_5min]
    confluence_mode: [global_cluster, anchor_rules]
    # Phase-2 open set (commented for documentation; active stage keeps touch/base):
    # trigger: [touch, reject, break, reclaim, 3c]
    # trigger_timeframe: [base, 1min, 5min, 15min]
    trigger: [touch, reject, break, reclaim, 3c]
    trigger_timeframe: [base, 1min, 5min, 15min]
    otf:
      - {enabled: false}
      - {enabled: true, timeframes: [5m], alignment_mode: all, minimum_consecutive_bars: 3}
      - {enabled: true, timeframes: [15m], alignment_mode: all, minimum_consecutive_bars: 3}
      - {enabled: true, timeframes: [30m], alignment_mode: all, minimum_consecutive_bars: 3}
      - {enabled: true, timeframes: [5m, 15m, 30m], alignment_mode: all, minimum_consecutive_bars: 3}

  mode_rules:
    global_cluster:
      selected_levels: ["${core_level}", "${partner_levels...}"]
    anchor_rules:
      selected_levels: []
      anchor_level: "${core_level}"
      confluence_rules:
        from_partners: required

  report:
    primary_metric: expectancy_r
    secondary_metrics: [profit_factor, max_drawdown_r, trade_count, total_r]
    min_trades: 30
    group_by: [partner_levels, confluence_mode, trigger, trigger_timeframe, otf]
    otf_baseline: {enabled: false}
    multiple_testing: warn

  # ACTIVE stage-first filter → 40 cells. Phase 2: remove/widen stage here
  # (unpromoted example) to open the full 800-cell cartesian — not on a promote draft.
  stage:
    mode: filter
    include:
      trigger: [touch]
      trigger_timeframe: [base]
# Phase 2: remove/widen stage on this example (full factor domains), or restore
# those domains onto a survivor draft before opening axes. Full cartesian = 800.
