[assistant]
provider = "openai"
model = "gpt-5.6-luna"
max_tool_rounds = 8
max_history_messages = 12
max_retries = 2

[assistant.execution]
require_explicit_confirmation = true
max_grid_cells = 500
max_simulations = 5000

[assistant.explanations]
evidence_only = true

[assistant.results_qa]
# Text results discussion (RQ-1). Uses existing OpenAI client/settings.
# enabled=true is OK; runtime still requires OPENAI_API_KEY or UI remediates.
enabled = true
# Overrides top-level [assistant].max_history_messages for this channel.
max_history_messages = 12
# When true (RQ-2), allow RO TIME.analyze if time_grouped_summary missing.
allow_time_enrichment = false

[assistant.product_help]
# enabled=true is OK; runtime still requires OPENAI_API_KEY or UI remediates.
enabled = true
# Overrides top-level [assistant].max_history_messages for this channel.
max_history_messages = 12
max_corpus_chars = 24000

[assistant.ux]
# Research Assistant page surface preselection (RUX-series).
# "discuss" | "help" | "draft". Missing/unknown → discuss.
default_mode = "discuss"

[assistant.voice]
# Spoken Discuss/Help transport (VA-series). Default remains false through VA-6.
enabled = false
provider = "xai"
model = "grok-voice-think-fast-2.0"   # pin dated id; do not use rolling latest in CI/evals
voice = "eve"
mode = "push_to_talk"              # VA-4; "realtime" added in VA-5
channels = ["results_qa", "product_help"]
max_session_minutes = 15
store_audio = false
allow_web_search = false
require_tool_for_numbers = true
ephemeral_token_ttl_seconds = 300
max_history_messages = 12
max_retries = 2
