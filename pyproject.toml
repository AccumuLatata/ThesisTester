[build-system]
# G-4 / QI-12-06: floor clears PYSEC-2025-49 / 2026-1918 / 2026-3447
# (fixed by 78.1.1 / 70.0.0 / 83.0.0). Cap so a 85+ bump is a gated PR.
requires = ["setuptools>=83,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesistester"
description = "Intraday confluence-setup backtesting and research for index futures (ES/NQ)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AccumuLatata" }]
keywords = ["backtesting", "futures", "intraday", "quantitative-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["version"]

# Range SoT (QI-12-03 / QR G-3). App install is `pip install -e .`;
# `constraints.txt` is the CI lock. `pytest` is the `dev` extra only.
# Caps so a Streamlit minor or pandas major arrives as a test-gated
# Dependabot PR (QI-12-02 / QR G-2; proposal §7).
# pandas-major axis (named, not accidental): py3.10 is the pandas 2 cell
# (pandas 3 requires Python >=3.11); py3.11/3.12 require pandas 3 — same
# contract as the CI matrix assert (not merely "admit").
dependencies = [
    "streamlit>=1.56,<1.64",
    "pandas>=2.2,<3; python_version < '3.11'",
    "pandas>=3,<4; python_version >= '3.11'",
    "numpy>=1.26,<3",
    "plotly>=5.22,<8",
    "pyarrow>=16,<25",
    "PyYAML>=6.0.3,<7",
    "tomli>=2.2,<3; python_version < '3.11'",
    "kaleido>=1.3.0",
    "pdfplumber>=0.11.4,<0.12",
]

[project.optional-dependencies]
# `ruff` is capped to one minor series: `ruff format --check` and lint rule defaults
# change between minors, and CI must not turn red because of a formatter release.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
    "import-linter>=2.3,<3",
    # mypy is capped to one major: --strict error inventory drifts across
    # minors, and B-11's per-file ratchet must not jump because of a release.
    "mypy>=2.3,<3",
    # G-4 / QI-12-06: warn-first scanners. Blocking flip is a later PR.
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/AccumuLatata/ThesisTester"
Documentation = "https://github.com/AccumuLatata/ThesisTester/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "thesistester.__version__" }

# Only the library is packaged. The Streamlit entry points (`app.py`, `pages/`) and the
# test suite stay outside the distribution and keep working from a repo checkout.
[tool.setuptools.packages.find]
include = ["thesistester*"]

[tool.setuptools.package-data]
"thesistester.journal" = ["tag_map.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# B-15 / QI-11-05: warn-first marker set. The required CI cell is still the
# full unmarked suite (`pytest -q`). `pytest -m unit` is the local loop.
# `--strict-markers` fails unknown names only — unmarked tests stay legal
# and become `unit` via tests/conftest.py. Do not add xdist here; `serial`
# must land on AppTest files first (B-12 / B-13).
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated test; default class when no other class marker is set (B-15 / QI-11-05)",
    "integration: cross-module or process-level path (OTF/lifecycle/3c; AppTest via serial)",
    "golden: identity golden-master family (legacy or additive default-on)",
    "eval: offline assistant/voice release-gate evaluations (stub clients)",
    "benchmark: informational timing harness (median_ms >= 0; not a perf gate)",
    "oracle: env-gated desk oracle (Quantower / session-20 ticks; skipped in CI)",
    "serial: AppTest / process-global Streamlit harness; isolate from xdist (B-12 / QI-11-03)",
]

[tool.coverage.run]
source = ["thesistester"]
branch = true

[tool.coverage.report]
# Statement + branch of `thesistester`. CI warn-first floor is 82%
# (`COVERAGE_FLOOR` in .github/workflows/ci.yml; B-6 / QI-12-04 measured
# QI-0 / QI-11 line). Do not set fail_under here — a later PR flips the
# same floor to blocking (`--cov-fail-under` / fail_under), then ratchet
# +1 pt per release.
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# B-11 / QI-12-05: path-scoped type-check. Informational CI job
# `mypy (informational)` only — not a G-1 required check. `--strict` is
# scoped to these two trees (not repo-wide). `api.py` / `data/` / `levels/`
# are later. QI-12 §2.3 five-tree probe was 164; this config is engine +
# analytics only. `no_site_packages` keeps numpy stubs (3.12 `type`
# statements) from aborting a 3.10-target run. Blocking flip is a later PR.
[tool.mypy]
python_version = "3.10"
files = ["thesistester/engine", "thesistester/analytics"]
ignore_missing_imports = true
no_site_packages = true
strict = true
pretty = false
show_error_codes = true

# G-4 / QI-12-06: CI `bandit (warn-first)` uses the same tree. High must
# stay 0 (lock: tests/test_g4_security_scans.py). Medium urlopen (B310)
# is warn-first. Blocking flip is a later PR.
[tool.bandit]
targets = ["thesistester"]
exclude_dirs = ["tests", ".thesistester_store"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is excluded on purpose: ruff formats fenced Python blocks, which would silently
# rewrite illustrative snippets in historical design documents (and make docs PRs fail
# formatting for prose reasons). R9 keeps tooling scoped to executable Python.
extend-exclude = [".thesistester_store", "sample_data", "*.md"]

[tool.ruff.lint]
# R9 set plus one widening family per PR (QI-12-09 / B-17). `B` first
# (B023 loop-variable = C1 class; B905 zip-without-strict). Never `S` on
# tests/; never `PLR2004` as a first wave. Next family is its own PR.
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# QI-10-08 / B-14: only Data executes code before importing `thesistester`
# (REPO_ROOT onto sys.path). Other pages import at module top and resolve
# via `pip install -e .` (or AppTest inserting the repo root).
"pages/1_Data.py" = ["E402"]
# Test fixtures use `l`/`O` as level/OHLC shorthand. Noisy bugbear on
# tests (QI-12-09): keep B023 (C1 loop-variable) enforced.
"tests/**" = ["E741", "B009", "B905", "B017", "B904"]
