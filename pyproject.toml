[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesistester"
description = "Intraday confluence-setup backtesting and research for index futures (ES/NQ)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AccumuLatata" }]
keywords = ["backtesting", "futures", "intraday", "quantitative-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["version"]

# Range SoT (QI-12-03 / QR G-3). App install is `pip install -e .`;
# `constraints.txt` is the CI lock. `pytest` is the `dev` extra only.
# Caps so a Streamlit minor or pandas major arrives as a test-gated
# Dependabot PR (QI-12-02 / QR G-2; proposal §7).
# pandas-major axis (named, not accidental): py3.10 is the pandas 2 cell
# (pandas 3 requires Python >=3.11); py3.11/3.12 require pandas 3 — same
# contract as the CI matrix assert (not merely "admit").
dependencies = [
    "streamlit>=1.56,<1.64",
    "pandas>=2.2,<3; python_version < '3.11'",
    "pandas>=3,<4; python_version >= '3.11'",
    "numpy>=1.26,<3",
    "plotly>=5.22,<7",
    "pyarrow>=16,<25",
    "PyYAML>=6.0.3,<7",
    "tomli>=2.2,<3; python_version < '3.11'",
    "kaleido>=1.3.0",
    "pdfplumber>=0.11.4,<0.12",
]

[project.optional-dependencies]
# `ruff` is capped to one minor series: `ruff format --check` and lint rule defaults
# change between minors, and CI must not turn red because of a formatter release.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/AccumuLatata/ThesisTester"
Documentation = "https://github.com/AccumuLatata/ThesisTester/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "thesistester.__version__" }

# Only the library is packaged. The Streamlit entry points (`app.py`, `pages/`) and the
# test suite stay outside the distribution and keep working from a repo checkout.
[tool.setuptools.packages.find]
include = ["thesistester*"]

[tool.setuptools.package-data]
"thesistester.journal" = ["tag_map.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["thesistester"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is excluded on purpose: ruff formats fenced Python blocks, which would silently
# rewrite illustrative snippets in historical design documents (and make docs PRs fail
# formatting for prose reasons). R9 keeps tooling scoped to executable Python.
extend-exclude = [".thesistester_store", "sample_data", "*.md"]

[tool.ruff.lint]
# Deliberately minimal (R9 is hygiene, not a refactor): pycodestyle errors/warnings and
# pyflakes correctness rules only. Widening the rule set is a separate, reviewable PR.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages bootstrap `sys.path` before importing `thesistester`, so module-level
# imports intentionally follow executable code.
"pages/*.py" = ["E402"]
# Test fixtures use `l`/`O` as level/OHLC shorthand in dense hand-built bar tables.
"tests/**" = ["E741"]
