name: CI

# R9 regression-safety gate (docs/ENGINEERING_PROPOSAL.md §4.9): full pytest + lint on
# every push and pull request. Coverage is warn-first at the QI-0 / QI-11 measured
# 82% (B-6 / QI-12-04), not the R9 88% baseline or the old 85% informational line.
# Still not a merge gate — a later PR flips the same floor to --cov-fail-under,
# then ratchet +1 pt per release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Warn-first only: CI emits ::warning below this line, it never fails on coverage.
  # 82% is the QI-0 / QI-11 measured statement+branch total of `thesistester`
  # (B-6 / QI-12-04). R9 baseline was 88%; the previous informational line was 85%.
  # A later PR flips this same floor to --cov-fail-under, then ratchet +1 pt/release.
  COVERAGE_FLOOR: 82

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # Ruff comes from the `dev` extra so its pinned version is the single source of
      # truth for local runs and CI alike (installing the extra itself would pull the
      # whole app dependency tree for a lint-only job).
      - name: Resolve pinned ruff requirement
        id: ruff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          dev = data["project"]["optional-dependencies"]["dev"]
          print("spec=" + next(req for req in dev if req.startswith("ruff")))
          PY
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ steps.ruff.outputs.spec }}" -c constraints.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  import-linter:
    # B-10 / QI-12-07: warn-first. Not a G-1 required check — do not rename
    # this job onto the six frozen display names. Blocking flip is a later PR.
    name: import-linter (warn-first)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install package + import-linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . import-linter -c constraints.txt
      - name: lint-imports (warn-first)
        run: |
          set +e
          out="$(lint-imports --config .importlinter --no-cache 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "import-linter: all contracts kept (warn-first job; not a G-1 required check)."
            exit 0
          fi
          # Contract violations are warn-first. Config/runtime errors (no report) fail.
          if ! printf '%s\n' "$out" | grep -q "Contracts:"; then
            echo "::error title=import-linter::lint-imports failed before producing a contract report (config/runtime error, not warn-first)."
            exit 1
          fi
          broken="$(printf '%s\n' "$out" | awk '/BROKEN$/ {print}' | tr '\n' '|' | sed 's/|$//')"
          echo "::warning title=import-linter::Broken contracts (QI-12-07 / B-10 warn-first, not blocking): ${broken:-see log}. Known expected: C7 via journal.levels → study.schema → tick_vap → execution_artifacts → api. Blocking flip is a later PR."
          exit 0

  mypy:
    # B-11 / QI-12-05: informational. Not a G-1 required check — do not rename
    # this job onto the six frozen display names. Path-scoped engine/ +
    # analytics/ only (not --strict repo-wide). api.py later. Blocking flip
    # is a later PR. Type-error / ratchet-up is warn-first; config/runtime
    # crash still fails.
    name: mypy (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install package + mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mypy -c constraints.txt
      - name: mypy engine+analytics (informational ratchet)
        run: python -m tests.fixtures.mypy.check_ratchet

  bandit:
    # G-4 / QI-12-06: warn-first. Not a G-1 required check — do not rename
    # this job onto the six frozen display names. High must stay 0
    # (pytest lock). Medium findings emit ::warning. Blocking flip is a
    # later PR. Config/runtime crash still fails.
    name: bandit (warn-first)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit>=1.7,<2" -c constraints.txt
      - name: bandit -ll (warn-first)
        run: |
          set +e
          out="$(bandit -r thesistester -ll -f txt 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -q "Code scanned:"; then
            echo "::error title=bandit::bandit failed before producing a report (config/runtime error, not warn-first)."
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "bandit: no Medium+ findings (warn-first job; not a G-1 required check)."
            exit 0
          fi
          echo "::warning title=bandit::Medium+ findings (QI-12-06 / G-4 warn-first, not blocking). High must stay 0 via tests/test_g4_security_scans.py. Blocking flip is a later PR."
          exit 0

  pip-audit:
    # G-4 / QI-12-06: warn-first declared + transitive scan of the locked
    # install. Not a G-1 required check. Advisories emit ::warning.
    # Blocking flip is a later PR. Config/runtime crash still fails.
    name: pip-audit (warn-first)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit -c constraints.txt
      - name: pip-audit (warn-first)
        run: |
          set +e
          out="$(pip-audit --progress-spinner off 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "pip-audit: no known advisories (warn-first job; not a G-1 required check)."
            exit 0
          fi
          # Exit 1 is "vulnerabilities found". Other codes are runtime errors.
          if [ "$code" -ne 1 ]; then
            echo "::error title=pip-audit::pip-audit failed before producing an advisory report (config/runtime error, not warn-first)."
            exit 1
          fi
          echo "::warning title=pip-audit::Advisories on declared or transitive deps (QI-12-06 / G-4 warn-first, not blocking). Blocking flip is a later PR."
          exit 0

  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # QI-12-02 / G-2: pandas-major axis is named (not accidental).
      # Display names stay `pytest (py3.10|3.11|3.12)` — G-1 freeze.
      # py3.10 = pandas 2 cell; py3.11 / py3.12 = pandas 3 cells.
      matrix:
        include:
          - python-version: "3.10"
            pandas-major: "2"
          - python-version: "3.11"
            pandas-major: "3"
          - python-version: "3.12"
            pandas-major: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
      - name: Assert pandas major for this matrix cell
        env:
          EXPECTED_PANDAS_MAJOR: ${{ matrix.pandas-major }}
        run: |
          python - <<'PY'
          import os
          import pandas
          import streamlit

          expected = int(os.environ["EXPECTED_PANDAS_MAJOR"])
          got = int(pandas.__version__.split(".", 1)[0])
          assert got == expected, (
              f"pandas {pandas.__version__} major {got} != {expected} "
              "(QI-12-02 named axis)"
          )
          print(f"pandas {pandas.__version__} (major {got}) matches cell {expected}")

          st_parts = streamlit.__version__.split(".")
          st_major, st_minor = int(st_parts[0]), int(st_parts[1])
          assert (st_major, st_minor) < (1, 64), (
              f"streamlit {streamlit.__version__} is not <1.64 "
              "(QI-12-02 / #478 cap)"
          )
          print(f"streamlit {streamlit.__version__} is inside <1.64 cap")
          PY
      - name: Record resolved dependency versions
        run: python -m pip list
      - name: pytest with coverage
        run: pytest -q --cov=thesistester --cov-report=term-missing --cov-report=xml
      - name: Report coverage (informational)
        run: |
          total="$(python -m coverage report --format=total)"
          echo "Coverage: ${total}% (warn-first floor: ${COVERAGE_FLOOR}%; not blocking)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${total}" -lt "${COVERAGE_FLOOR}" ]; then
            echo "::warning title=Coverage below floor::${total}% < ${COVERAGE_FLOOR}% (warn-first, not blocking)"
          fi
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: editable install (no dev extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: pip install -e . in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install -e . -c constraints.txt
          /tmp/venv/bin/python -c "import thesistester; print(thesistester.__version__)"
          /tmp/venv/bin/python -m pip check

  golden-guard:
    # Enforces the golden-master regeneration policy (proposal §4.1.3): golden files may
    # only change in a PR that carries the `GOLDEN_REGEN` label, so legacy-mode outputs
    # are never silently re-recorded.
    name: golden-master regeneration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for golden-fixture changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'GOLDEN_REGEN') }}
        run: |
          # Guard only the legacy-mode golden artifacts. Additive families
          # (e.g. otf_enabled_*) may land without GOLDEN_REGEN; rewriting the
          # recorded legacy outputs still requires the label.
          changed="$(git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" -- \
            tests/fixtures/golden/dataset_nq_1m_small.parquet \
            tests/fixtures/golden/trades_legacy.parquet \
            tests/fixtures/golden/trades_legacy.csv \
            tests/fixtures/golden/legacy_bundle_hash.txt \
            tests/fixtures/golden/fixture_manifest.json)"
          if [ -z "$changed" ]; then
            echo "No legacy golden-fixture changes."
            exit 0
          fi
          echo "Legacy golden fixtures changed:"
          echo "$changed"
          if [ "$HAS_LABEL" = "true" ]; then
            echo "::notice title=Golden regeneration approved::GOLDEN_REGEN label present."
            exit 0
          fi
          echo "::error title=Legacy golden fixtures changed without GOLDEN_REGEN::Recorded legacy-mode outputs may only change in a dedicated PR labelled GOLDEN_REGEN (see tests/fixtures/golden/README.md)."
          exit 1
