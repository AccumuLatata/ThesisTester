# Frozen desk tag → engine token map (TJ6). Data, not code.
# Exact rows win before qualifier stripping. Desk owns additions; repo owns this file.
# Program B ANCHORS are covered exactly once: existing desk short forms stay
# byte-stable; remaining anchors use engine-token keys (no parallel aliases).

